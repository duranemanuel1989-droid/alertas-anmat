name: Alertas ANMAT

# Cuando se ejecuta:
on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas (horario UTC)
  workflow_dispatch:          # boton para ejecutarlo a mano cuando quieras

# Permite que la accion guarde el archivo vistos.json en el repo.
permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar alertas y avisar por Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alertas.py

      - name: Guardar las alertas ya avisadas
        run: |
          if [ -n "$(git status --porcelain vistos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add vistos.json
            git commit -m "Actualizar alertas vistas"
            git push
          else
            echo "Sin cambios en vistos.json"
          fi
